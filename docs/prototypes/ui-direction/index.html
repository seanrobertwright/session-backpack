<title>Backpack UI Directions</title>

<!--
  PROTOTYPE — throwaway. Wayfinder ticket #16 "Prototype: UI direction — dashboard & session browser".

  Question: what should Backpack look and feel like?
  Shape:    three radically different directions for the vault dashboard + session browser,
            switchable via ?variant=A|B|C (floating bar, bottom centre, or arrow keys).
  Theming:  three skins via ?skin=slate|paper|terminal, swapped by re-defining CSS custom
            properties on a [data-skin] attribute — the same mechanism the real app will use
            (Tailwind v4 CSS variables + data-theme swap, per research #9).
  Data:     fake but consistent — the same three machines, nine adapters and fourteen sessions
            appear in all three variants so the comparison is like-for-like.
  Nothing here is production code. The winner gets rewritten properly.
-->

<style>
/* ── Tokens ─────────────────────────────────────────────────────────────────
   Bare :root is the light ("paper") set. The dark ("slate") set is applied for
   the two viewer states that mean dark, and every skin can override outright.  */

:root {
  --bg:          #eef1f3;
  --surface:     #ffffff;
  --surface-2:   #f4f7f8;
  --surface-3:   #e6ebee;
  --line:        #d6dee2;
  --line-strong: #b9c5cb;
  --text:        #101a1f;
  --text-dim:    #3f5059;
  --text-mute:   #6d818c;
  --accent:      #0c7c89;
  --accent-soft: #d9eef0;
  --accent-ink:  #ffffff;
  --ok:          #2b7f4e;
  --ok-soft:     #dcefe3;
  --warn:        #8f6510;
  --warn-soft:   #f6ecd6;
  --crit:        #ad3838;
  --crit-soft:   #f7dedd;
  --m1:          #0c7c89;
  --m2:          #7a4fa3;
  --m3:          #a2662a;
  --shadow:      0 1px 2px rgba(16,26,31,.08), 0 8px 24px rgba(16,26,31,.06);
  --shadow-lift: 0 2px 6px rgba(16,26,31,.10), 0 20px 50px rgba(16,26,31,.14);

  --ui:   "Segoe UI Variable Text", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: "Cascadia Mono", "JetBrains Mono", "SF Mono", ui-monospace, Consolas, "Liberation Mono", monospace;
  --r:    6px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-skin="paper"]):not([data-skin="terminal"]) {
    --bg:#0d1216; --surface:#151b21; --surface-2:#1b232a; --surface-3:#222c34;
    --line:#2a353e; --line-strong:#3c4a55;
    --text:#dae3e8; --text-dim:#a4b3bd; --text-mute:#768894;
    --accent:#38b7c4; --accent-soft:#123037; --accent-ink:#04191d;
    --ok:#57bb7e; --ok-soft:#13291d; --warn:#dda13a; --warn-soft:#2c2312; --crit:#e8706e; --crit-soft:#2e1817;
    --m1:#38b7c4; --m2:#a884d8; --m3:#d9a05f;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
    --shadow-lift: 0 2px 6px rgba(0,0,0,.55), 0 20px 50px rgba(0,0,0,.5);
  }
}

:root[data-theme="dark"]:not([data-skin="paper"]):not([data-skin="terminal"]),
:root[data-skin="slate"] {
  --bg:#0d1216; --surface:#151b21; --surface-2:#1b232a; --surface-3:#222c34;
  --line:#2a353e; --line-strong:#3c4a55;
  --text:#dae3e8; --text-dim:#a4b3bd; --text-mute:#768894;
  --accent:#38b7c4; --accent-soft:#123037; --accent-ink:#04191d;
  --ok:#57bb7e; --ok-soft:#13291d; --warn:#dda13a; --warn-soft:#2c2312; --crit:#e8706e; --crit-soft:#2e1817;
  --m1:#38b7c4; --m2:#a884d8; --m3:#d9a05f;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lift: 0 2px 6px rgba(0,0,0,.55), 0 20px 50px rgba(0,0,0,.5);
}

:root[data-skin="paper"] {
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f4f7f8; --surface-3:#e6ebee;
  --line:#d6dee2; --line-strong:#b9c5cb;
  --text:#101a1f; --text-dim:#3f5059; --text-mute:#6d818c;
  --accent:#0c7c89; --accent-soft:#d9eef0; --accent-ink:#ffffff;
  --ok:#2b7f4e; --ok-soft:#dcefe3; --warn:#8f6510; --warn-soft:#f6ecd6; --crit:#ad3838; --crit-soft:#f7dedd;
  --m1:#0c7c89; --m2:#7a4fa3; --m3:#a2662a;
  --shadow: 0 1px 2px rgba(16,26,31,.08), 0 8px 24px rgba(16,26,31,.06);
  --shadow-lift: 0 2px 6px rgba(16,26,31,.10), 0 20px 50px rgba(16,26,31,.14);
}

/* Terminal: a deliberately un-sleek third pole, to prove the token seam holds
   under a skin that changes the typeface and the corner radius too. */
:root[data-skin="terminal"] {
  --bg:#080a09; --surface:#0d100e; --surface-2:#121614; --surface-3:#18201b;
  --line:#20291f; --line-strong:#33422f;
  --text:#c9d8c0; --text-dim:#8fa287; --text-mute:#66765f;
  --accent:#e8a33d; --accent-soft:#241a09; --accent-ink:#0a0b08;
  --ok:#79bd5c; --ok-soft:#131f0f; --warn:#e8a33d; --warn-soft:#241a09; --crit:#e2645a; --crit-soft:#241110;
  --m1:#e8a33d; --m2:#79bd5c; --m3:#67a9c4;
  --shadow:none; --shadow-lift: 0 0 0 1px #33422f;
  --ui: var(--mono);
  --r: 0px;
}

/* ── Reset & shell ─────────────────────────────────────────────────────── */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--ui);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }

/* The prototype fills the viewport like a real desktop window: the shell never
   scrolls, individual panes do. That is the only way variant density reads true. */
.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Title bar — this is the OS window, not part of any variant's design. */
.titlebar {
  flex: 0 0 auto;
  height: 38px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  z-index: 40;
}
.titlebar .mark {
  display: flex; align-items: center; gap: 7px;
  font-weight: 600; font-size: 12px; letter-spacing: .02em;
}
.titlebar .mark svg { display: block; }
.titlebar .spacer { flex: 1; }
.skinpick { display: flex; align-items: center; gap: 6px; }
.skinpick .lbl {
  font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--text-mute);
}
.skinpick .opts { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.skinpick button {
  padding: 3px 9px; font-size: 11px; color: var(--text-dim);
  background: var(--surface); border-right: 1px solid var(--line);
}
.skinpick button:last-child { border-right: 0; }
.skinpick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.wincontrols { display: flex; gap: 14px; color: var(--text-mute); font-size: 11px; padding-left: 6px; }

.stage { flex: 1 1 auto; display: flex; min-height: 0; overflow: hidden; }
.stage > * { flex: 1 1 auto; min-width: 0; min-height: 0; }

/* ── Shared atoms ──────────────────────────────────────────────────────── */

.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num  { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.dim  { color: var(--text-mute); }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
}
.pill.ok   { background: var(--ok-soft);   color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.idle { background: var(--surface-3); color: var(--text-mute); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: 0 0 auto; }

.tool-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: var(--r); flex: 0 0 auto;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
  background: var(--surface-3); color: var(--text-dim);
  border: 1px solid var(--line);
}
.mchip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--text-dim);
}
.mchip::before {
  content: ""; width: 7px; height: 7px; border-radius: 2px;
  background: var(--mc, var(--text-mute));
}

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 13px; border-radius: var(--r);
  border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--text); font-size: 12px; font-weight: 500;
}
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: none; color: var(--text-dim); }
.btn.ghost:hover { background: var(--surface-3); color: var(--text); }
.btn.sm { padding: 3px 9px; font-size: 11px; }

.eyebrow {
  font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--text-mute); font-weight: 600;
}

.scroll { overflow-y: auto; overscroll-behavior: contain; }
.scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 6px; border: 3px solid var(--surface); }
.scroll::-webkit-scrollbar-track { background: transparent; }

.tablewrap { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-size: 12px; }
table.grid th {
  text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--text-mute); font-weight: 600; padding: 7px 12px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.grid td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.grid tbody tr:hover { background: var(--surface-2); }

/* ══ VARIANT A — Console ═══════════════════════════════════════════════════
   Status-first. An icon rail, a wide health band that answers "am I safe?"
   before anything else, then adapter and machine tables. Sessions are a tab,
   not the point. Closest cousins: Backblaze, Tailscale's admin, Little Snitch. */

.vA { display: flex; background: var(--bg); }
.vA .rail {
  flex: 0 0 60px; background: var(--surface-2); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0;
}
.vA .rail button {
  width: 40px; height: 40px; border-radius: var(--r);
  display: grid; place-items: center; color: var(--text-mute);
}
.vA .rail button:hover { background: var(--surface-3); color: var(--text); }
.vA .rail button[aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
.vA .rail .gap { flex: 1; }

.vA .main { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

.vA .band {
  display: flex; align-items: center; gap: 22px;
  padding: 20px 26px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.vA .band .shield { flex: 0 0 auto; color: var(--ok); }
.vA .band .headline { flex: 1 1 auto; min-width: 0; }
.vA .band h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.vA .band p { margin: 3px 0 0; color: var(--text-mute); font-size: 12px; }
.vA .band .acts { display: flex; gap: 8px; flex: 0 0 auto; }

.vA .stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.vA .stat { padding: 14px 26px; border-right: 1px solid var(--line); }
.vA .stat:last-child { border-right: 0; }
.vA .stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-mute); font-weight: 600; }
.vA .stat .v { font-family: var(--mono); font-size: 19px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.vA .stat .v small { font-size: 12px; color: var(--text-mute); margin-left: 3px; }

.vA .tabs { display: flex; gap: 2px; padding: 0 26px; background: var(--surface); border-bottom: 1px solid var(--line); }
.vA .tabs button {
  padding: 10px 14px; font-size: 12px; color: var(--text-mute);
  border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500;
}
.vA .tabs button:hover { color: var(--text); }
.vA .tabs button[aria-current="true"] { color: var(--text); border-bottom-color: var(--accent); }

.vA .body { flex: 1 1 auto; min-height: 0; padding: 20px 26px 100px; }
.vA .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.vA .panel > header {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.vA .panel > header h2 { margin: 0; font-size: 12px; font-weight: 600; }
.vA .panel > header .spacer { flex: 1; }
.vA .stripe { display: inline-block; width: 3px; height: 15px; border-radius: 2px; vertical-align: -3px; margin-right: 8px; }
.vA .filters { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
.vA .filters input {
  flex: 1 1 auto; padding: 6px 11px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
}
.vA .filters input::placeholder { color: var(--text-mute); }
.vA .sess-title { font-weight: 500; }
.vA .sess-proj { color: var(--text-mute); font-family: var(--mono); font-size: 11px; }
.vA tbody tr { cursor: default; }
.vA tbody tr.click { cursor: pointer; }

.vA .detail { display: flex; flex-direction: column; gap: 14px; }
.vA .detail .back { align-self: flex-start; }
.vA .detail .head { display: flex; align-items: flex-start; gap: 14px; }
.vA .detail .head h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
.vA .detail .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--text-mute); font-size: 11px; }

/* ══ VARIANT B — Navigator ═════════════════════════════════════════════════
   Three panes: source tree, session list, reading pane. The vault dashboard is
   just the first item in the tree. Built for someone who lives in the archive.
   Closest cousins: a mail client, Linear, Zed's project panel. */

.vB { display: flex; background: var(--surface); }

.vB .side {
  flex: 0 0 216px; border-right: 1px solid var(--line); background: var(--surface-2);
  display: flex; flex-direction: column; min-height: 0;
}
.vB .side .search { padding: 10px; border-bottom: 1px solid var(--line); }
.vB .side .search input {
  width: 100%; padding: 5px 9px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface); color: var(--text); font-size: 12px;
}
.vB .side .tree { flex: 1 1 auto; min-height: 0; padding: 8px 6px 20px; }
.vB .side .grouphdr {
  padding: 12px 10px 5px; font-size: 10px; text-transform: uppercase;
  letter-spacing: .09em; color: var(--text-mute); font-weight: 600;
}
.vB .side .item {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 5px 10px; border-radius: var(--r); color: var(--text-dim); font-size: 12px; text-align: left;
}
.vB .side .item:hover { background: var(--surface-3); color: var(--text); }
.vB .side .item[aria-current="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.vB .side .item .count { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-mute); }
.vB .side .item[aria-current="true"] .count { color: var(--accent); }
.vB .side .foot {
  margin-top: auto; padding: 10px; border-top: 1px solid var(--line);
  font-size: 11px; color: var(--text-mute); display: flex; align-items: center; gap: 7px;
}

.vB .list {
  flex: 0 0 340px; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  background: var(--surface);
}
.vB .list > header {
  display: flex; align-items: center; gap: 8px; padding: 9px 14px;
  border-bottom: 1px solid var(--line); background: var(--surface-2);
}
.vB .list > header h2 { margin: 0; font-size: 12px; font-weight: 600; }
.vB .list > header .spacer { flex: 1; }
.vB .list > .scroll { flex: 1 1 auto; min-height: 0; padding-bottom: 90px; }
.vB .daysep {
  position: sticky; top: 0; z-index: 2;
  padding: 6px 14px; font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
  color: var(--text-mute); font-weight: 600;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.vB .row {
  width: 100%; text-align: left; display: block; padding: 9px 14px;
  border-bottom: 1px solid var(--line); border-left: 2px solid transparent;
}
.vB .row:hover { background: var(--surface-2); }
.vB .row[aria-current="true"] { background: var(--accent-soft); border-left-color: var(--accent); }
.vB .row .l1 { display: flex; align-items: center; gap: 8px; }
.vB .row .l1 .t { flex: 1 1 auto; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vB .row .l1 .when { font-family: var(--mono); font-size: 10px; color: var(--text-mute); flex: 0 0 auto; }
.vB .row .l2 { display: flex; align-items: center; gap: 10px; margin-top: 4px; padding-left: 30px; }
.vB .row .l2 .proj { font-family: var(--mono); font-size: 10px; color: var(--text-mute); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.vB .read { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
.vB .read > header { padding: 14px 22px; border-bottom: 1px solid var(--line); }
.vB .read > header .top { display: flex; align-items: flex-start; gap: 12px; }
.vB .read > header h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1 1 auto; }
.vB .read > header .meta { display: flex; flex-wrap: wrap; gap: 5px 14px; margin-top: 7px; font-size: 11px; color: var(--text-mute); }
.vB .read .doc { padding: 18px 22px 100px; }

.vB .vaultpane { padding: 24px 30px 100px; }
.vB .vaultpane h2 { margin: 0 0 3px; font-size: 18px; font-weight: 600; }
.vB .vaultpane .sub { color: var(--text-mute); margin: 0 0 20px; }
.vB .vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; margin-bottom: 22px; }
.vB .vgrid > div { background: var(--surface); padding: 13px 15px; }
.vB .vgrid .k { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-mute); font-weight: 600; }
.vB .vgrid .v { font-family: var(--mono); font-size: 17px; margin-top: 4px; }

/* Turn rendering — three deliberately different treatments. */
.turns.bubble { display: flex; flex-direction: column; gap: 14px; max-width: 68ch; }
.turns.bubble .turn { display: flex; gap: 11px; }
.turns.bubble .who {
  flex: 0 0 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  font-size: 10px; font-weight: 700; font-family: var(--mono);
  background: var(--surface-3); color: var(--text-dim);
}
.turns.bubble .turn.user .who { background: var(--accent-soft); color: var(--accent); }
.turns.bubble .msg { flex: 1 1 auto; min-width: 0; }
.turns.bubble .msg .name { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-mute); font-weight: 600; margin-bottom: 3px; }
.turns.bubble .msg p { margin: 0 0 8px; }

.turns.flat { max-width: 74ch; }
.turns.flat .turn { padding: 11px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 76px 1fr; gap: 14px; }
.turns.flat .who { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-mute); font-weight: 600; padding-top: 2px; }
.turns.flat .turn.user .who { color: var(--accent); }
.turns.flat .msg p { margin: 0 0 8px; }

.turns.doc { max-width: 66ch; }
.turns.doc .turn { margin-bottom: 18px; }
.turns.doc .turn.user { border-left: 2px solid var(--accent); padding-left: 14px; }
.turns.doc .turn.assistant { padding-left: 16px; }
.turns.doc .who { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--text-mute); font-weight: 600; margin-bottom: 5px; }
.turns.doc .msg p { margin: 0 0 8px; }

.toolcall {
  font-family: var(--mono); font-size: 11px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 8px 11px; margin: 8px 0; color: var(--text-dim);
  display: flex; align-items: center; gap: 9px;
}
.toolcall .k { color: var(--accent); font-weight: 700; }
.toolcall .out { margin-left: auto; color: var(--text-mute); }
pre.code {
  font-family: var(--mono); font-size: 11px; line-height: 1.55;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r);
  padding: 10px 12px; margin: 8px 0; overflow-x: auto; color: var(--text-dim);
}

/* ══ VARIANT C — Timeline ══════════════════════════════════════════════════

      <div class="body scroll" id="A-body"></div>
    </div>
  </div>`);

  const body = node.querySelector("#A-body");

  const overview = () => `
    <div class="panel">
      <header><h2>Adapters</h2><span class="spacer"></span><span class="dim" style="font-size:11px">Capture runs automatically when a session file settles</span></header>
      <div class="tablewrap"><table class="grid">
        <thead><tr><th></th><th>Adapter</th><th>Watching</th><th>Sessions</th><th>Last capture</th><th>Status</th><th></th></tr></thead>
        <tbody>${TOOLS.map(t => `<tr>
          <td style="width:1px"><span class="stripe" style="background:var(--${t.state === "idle" ? "line-strong" : t.state})"></span></td>
          <td><div style="display:flex;align-items:center;gap:9px">${toolBadge(t.id)}<b style="font-weight:500">${esc(t.name)}</b></div></td>
          <td class="mono dim">${esc(t.where)}</td>
          <td class="num">${t.n}</td>
          <td class="mono dim">${esc(t.last)}</td>
          <td>${statePill(t.state)}</td>
          <td class="dim" style="font-size:11px">${esc(t.note)}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>`;

  const sessions = () => `
    <div class="filters">
      <input placeholder="Filter 657 sessions by project, title or id…" />
      <button class="btn sm">All adapters ▾</button>
      <button class="btn sm">All machines ▾</button>
      <button class="btn sm">Any time ▾</button>
    </div>
    <div class="panel">
      <div class="tablewrap"><table class="grid">
        <thead><tr><th></th><th>Session</th><th>Project</th><th>Machine</th><th>Captured</th><th>Turns</th><th>Size</th><th>Restore</th></tr></thead>
        <tbody>${SESSIONS.map(s => `<tr class="click" data-s="${s.id}">
          <td style="width:1px">${toolBadge(s.tool)}</td>
          <td><span class="sess-title">${esc(s.title)}</span></td>
          <td class="sess-proj">${esc(s.project)}</td>
          <td>${machineChip(s.machine)}</td>
          <td class="mono dim">${esc(s.day)} ${esc(s.time)}</td>
          <td class="num">${s.turns}</td>
          <td class="num dim">${esc(s.size)}</td>
          <td>${statePill(s.state === "ok" ? "ok" : "warn", s.resume)}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>`;

  const machines = () => `
    <div class="panel">
      <header><h2>Machines sharing this vault</h2></header>
      <div class="tablewrap"><table class="grid">
        <thead><tr><th>Machine</th><th>System</th><th>Sessions</th><th>Last seen</th><th>Vault key</th></tr></thead>
        <tbody>${Object.entries(MACHINES).map(([id,m]) => `<tr>
          <td><div style="display:flex;align-items:center;gap:9px">${machineChip(id)}<span class="dim" style="font-size:11px">${esc(m.kind)}</span></div></td>
          <td class="mono dim">${esc(m.os)}</td>
          <td class="num">${m.sessions}</td>
          <td class="mono dim">${esc(m.seen)}</td>
          <td>${statePill("ok", "Remembered")}</td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>
    <p class="dim" style="margin-top:14px;font-size:11px;max-width:60ch">Each machine unlocks the vault once and remembers the key in its system keychain. Adding a fourth machine means typing the passphrase one time.</p>`;

  const detail = (s) => `
    <div class="detail">
      <button class="btn ghost sm back">← All sessions</button>
      <div class="panel">
        <header><h2>${esc(s.title)}</h2><span class="spacer"></span>${statePill(s.state === "ok" ? "ok" : "warn", s.resume)}<button class="btn sm">Export…</button><button class="btn sm primary">Restore to this machine</button></header>
        <div style="padding:18px 22px 40px">
          <div class="meta" style="display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--text-mute);font-size:11px;margin-bottom:18px">${sessionMeta(s)}</div>
          ${turnsHTML("flat")}
        </div>
      </div>
    </div>`;

  function draw() {
    body.innerHTML = open ? detail(open) : tab === "overview" ? overview() : tab === "sessions" ? sessions() : machines();
    body.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => { open = sess(tr.dataset.s); draw(); });
    const back = body.querySelector(".back"); if (back) back.onclick = () => { open = null; draw(); };
  }
  node.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    tab = b.dataset.t; open = null;
    node.querySelectorAll("[data-t]").forEach(x => x.setAttribute("aria-current", String(x.dataset.t === tab)));
    draw();
  });
  draw();
  root.append(node);
}

/* ═══ VARIANT B — Navigator ═══════════════════════════════════════════════ */

function renderB(root) {
  let source = "vault", picked = SESSIONS[0].id;

  const node = el(`<div class="vB">
    <div class="side">
      <div class="search"><input placeholder="Search sessions…" /></div>
      <div class="tree scroll">
        <button class="item" data-src="vault" data-label="Vault" aria-current="true">${icon.vault}<span>Vault</span></button>
        <button class="item" data-src="all" data-label="All sessions">${icon.list}<span>All sessions</span><span class="count">657</span></button>
        <div class="grouphdr">Machines</div>
        ${Object.entries(MACHINES).map(([id,m]) => `<button class="item" data-src="m:${id}" data-label="${esc(m.name)}"><span class="mchip" style="--mc:${m.hue}"></span><span>${esc(m.name)}</span><span class="count">${m.sessions}</span></button>`).join("")}
        <div class="grouphdr">Adapters</div>
        ${TOOLS.map(t => `<button class="item" data-src="t:${t.id}" data-label="${esc(t.name)}">${toolBadge(t.id)}<span>${esc(t.name)}</span><span class="count">${t.n}</span></button>`).join("")}
      </div>
      <div class="foot">${icon.lock}<span>Unlocked · remembered on nimbus</span></div>
    </div>

    <div class="list">
      <header><h2 id="B-src">Vault</h2><span class="spacer"></span><button class="btn sm ghost">Sort ▾</button></header>
      <div class="scroll" id="B-rows"></div>
    </div>

    <div class="read scroll" id="B-read"></div>
  </div>`);

  const rows = node.querySelector("#B-rows"), read = node.querySelector("#B-read"), srcLabel = node.querySelector("#B-src");

  const filtered = () => {
    if (source.startsWith("m:")) return SESSIONS.filter(s => s.machine === source.slice(2));
    if (source.startsWith("t:")) return SESSIONS.filter(s => s.tool === source.slice(2));
    return SESSIONS;
  };

  function drawRows() {
    if (source === "vault") { rows.innerHTML = ""; return; }
    const list = filtered();
    let html = "";
    DAYS.forEach(d => {
      const inDay = list.filter(s => s.day === d);
      if (!inDay.length) return;
      html += `<div class="daysep">${esc(d)}</div>`;
      html += inDay.map(s => `<button class="row" data-s="${s.id}" ${s.id === picked ? 'aria-current="true"' : ""}>
        <span class="l1">${toolBadge(s.tool)}<span class="t">${esc(s.title)}</span><span class="when">${esc(s.time)}</span></span>
        <span class="l2">${machineChip(s.machine)}<span class="proj">${esc(s.project)}</span><span class="when mono" style="margin-left:auto;color:var(--text-mute);font-size:10px">${esc(s.size)}</span></span>
      </button>`).join("");
    });
    rows.innerHTML = html || `<p class="dim" style="padding:22px 14px">No sessions captured here yet.</p>`;
    rows.querySelectorAll(".row").forEach(r => r.onclick = () => { picked = r.dataset.s; drawRows(); drawRead(); });
  }

  const vaultPane = () => `
    <div class="vaultpane">
      <h2>Vault</h2>
      <p class="sub">${esc(VAULT.path)} — synced by ${esc(VAULT.sync)}, encrypted with ${esc(VAULT.encryption)}.</p>
      <div class="vgrid">
        <div><div class="k">Sessions</div><div class="v">${VAULT.sessions}</div></div>
        <div><div class="k">Size</div><div class="v">${VAULT.size}</div></div>
        <div><div class="k">Captures</div><div class="v">${VAULT.captures.toLocaleString()}</div></div>
        <div><div class="k">Last capture</div><div class="v" style="font-size:14px">${esc(VAULT.lastCapture)}</div></div>
      </div>
      <div class="eyebrow" style="margin-bottom:8px">Adapters needing attention</div>
      <div class="tablewrap" style="border:1px solid var(--line);border-radius:var(--r);margin-bottom:24px">
        <table class="grid">
          <tbody>${TOOLS.filter(t => t.state !== "ok").map(t => `<tr>
            <td style="width:1px">${toolBadge(t.id)}</td>
            <td><b style="font-weight:500">${esc(t.name)}</b><div class="dim" style="font-size:11px">${esc(t.note)}</div></td>
            <td style="text-align:right">${statePill(t.state)}</td>
            <td style="width:1px"><button class="btn sm">Fix</button></td>
          </tr>`).join("")}</tbody>
        </table>
      </div>
      <div class="eyebrow" style="margin-bottom:8px">Machines</div>
      <div class="tablewrap" style="border:1px solid var(--line);border-radius:var(--r)">
        <table class="grid">
          <tbody>${Object.entries(MACHINES).map(([id,m]) => `<tr>
            <td>${machineChip(id)}</td><td class="mono dim">${esc(m.os)} · ${esc(m.kind)}</td>
            <td class="num">${m.sessions} sessions</td><td class="mono dim" style="text-align:right">seen ${esc(m.seen)}</td>
          </tr>`).join("")}</tbody>
        </table>
      </div>
    </div>`;

  function drawRead() {
    if (source === "vault") { read.innerHTML = vaultPane(); return; }
    const s = sess(picked) ?? filtered()[0];
    if (!s) { read.innerHTML = `<p class="dim" style="padding:30px">Nothing selected.</p>`; return; }
    read.innerHTML = `
      <header>
        <div class="top">
          <h2>${esc(s.title)}</h2>
          <button class="btn sm">Export…</button>
          <button class="btn sm primary">Restore</button>
        </div>
        <div class="meta">${sessionMeta(s)}<span>${statePill(s.state === "ok" ? "ok" : "warn", s.resume)}</span></div>
      </header>
      <div class="doc">${turnsHTML("bubble")}</div>`;
  }

  node.querySelectorAll("[data-src]").forEach(b => b.onclick = () => {
    source = b.dataset.src;
    node.querySelectorAll("[data-src]").forEach(x => x.setAttribute("aria-current", String(x.dataset.src === source)));
    srcLabel.textContent = b.dataset.label;
    const f = filtered(); if (f.length && !f.some(s => s.id === picked)) picked = f[0].id;
    drawRows(); drawRead();
  });

  drawRows(); drawRead();
  root.append(node);
}

/* ═══ VARIANT C — Timeline ════════════════════════════════════════════════ */

function renderC(root) {
  const openSet = new Set([0]);
  let sheet = null;

  const node = el(`<div class="vC">
    <div class="ribbon">
      <span class="health"><span class="pill ok"><span class="dot"></span>Protected</span><strong>Last capture ${esc(VAULT.lastCapture)}</strong></span>
      <span class="sep"></span>
      <span class="kv"><b>${VAULT.sessions}</b> sessions</span>
      <span class="kv"><b>${VAULT.size}</b> in vault</span>
      <span class="kv">back to <b>${esc(VAULT.oldest)}</b></span>
      <span class="spacer"></span>
      <button class="btn sm">Restore from…</button>
      <button class="btn sm primary">Capture now</button>
    </div>
    <div class="lanes">
      <span class="lbl">Machines</span>
      ${Object.entries(MACHINES).map(([id,m]) => `<span class="mchip" style="--mc:${m.hue}">${esc(m.name)}<span class="dim" style="font-size:10px">· ${esc(m.seen)}</span></span>`).join("")}
      <span class="spacer" style="flex:1"></span>
      <span class="dim" style="font-size:11px">1 adapter needs attention · pi + oh-my-pi on pilot</span>
    </div>
    <div class="flow">
      <div class="scrub" id="C-scrub"><span class="spine"></span></div>
      <div class="stream scroll" id="C-stream"></div>
    </div>
  </div>`);

  node.querySelector("#C-scrub").insertAdjacentHTML("beforeend",
    ["Now", ...DAYS.slice(0,4).map(d => d === "Today" ? "14:04" : d), "Jul", "Jun", "May", "Apr", "Mar", "Feb"]
      .map((t,i) => `<button class="tick ${i === 0 ? "now" : ""}">${esc(t)}</button>`).join(""));

  const stream = node.querySelector("#C-stream");

  function draw() {
    let html = "";
    DAYS.forEach(d => {
      const caps = CAPTURES.filter(c => c.day === d);
      if (!caps.length) return;
      const n = caps.reduce((a,c) => a + c.sessions.length, 0);
      html += `<div class="daymark"><h3>${esc(d)}</h3><span class="n">${caps.length} captures · ${n} sessions</span></div>`;
      caps.forEach(c => {
        const i = CAPTURES.indexOf(c), isOpen = openSet.has(i);
        const tools = [...new Set(c.sessions.map(id => sess(id).tool))];
        html += `<div class="cap" data-open="${isOpen ? 1 : 0}">
          <button class="head" data-i="${i}">
            <span class="time">${esc(c.time)}</span>
            <span class="beads">${tools.map(t => `<span class="bead" style="--bead:${MACHINES[c.machine].hue}" title="${esc(TOOL[t].name)}"></span>`).join("")}</span>
            <span class="what"><b>${c.sessions.length} session${c.sessions.length > 1 ? "s" : ""}</b> from ${tools.map(t => esc(TOOL[t].name)).join(", ")} on ${esc(c.machine)}
              ${c.trigger === "manual" ? `<span class="pill idle" style="margin-left:8px">Manual</span>` : ""}
              ${c.warn ? `<span class="pill warn" style="margin-left:8px"><span class="dot"></span>${esc(c.warn)}</span>` : ""}
            </span>
            <span class="size">${esc(c.size)}</span>
            <span class="chev">${icon.chev}</span>
          </button>
          ${isOpen ? `<div class="drawer">${c.sessions.map(id => { const s = sess(id); return `<button data-s="${id}">
            ${toolBadge(s.tool)}<span class="t">${esc(s.title)}</span>
            <span class="mono dim" style="font-size:11px">${esc(s.project)}</span>
            <span class="num dim" style="font-size:11px">${s.turns} turns</span>
            <span class="num dim" style="font-size:11px">${esc(s.size)}</span>
            ${statePill(s.state === "ok" ? "ok" : "warn", s.resume)}
          </button>`; }).join("")}</div>` : ""}
        </div>`;
      });
    });
    html += `<p class="dim" style="padding:22px 30px;font-size:11px">Older captures load as you scrub — the vault reaches back to ${esc(VAULT.oldest)}.</p>`;
    stream.innerHTML = html;
    stream.querySelectorAll(".head").forEach(b => b.onclick = () => {
      const i = +b.dataset.i; openSet.has(i) ? openSet.delete(i) : openSet.add(i); draw();
    });
    stream.querySelectorAll(".drawer button").forEach(b => b.onclick = () => { sheet = sess(b.dataset.s); drawSheet(); });
  }

  function drawSheet() {
    node.querySelector(".overlay")?.remove();
    if (!sheet) return;
    const s = sheet;
    const ov = el(`<div class="overlay"><div class="sheet">
      <header>
        <div class="top"><h2>${esc(s.title)}</h2><button class="btn sm">Export…</button><button class="btn sm primary">Restore</button><button class="btn sm ghost close">✕</button></div>
        <div class="meta">${sessionMeta(s)}<span>${statePill(s.state === "ok" ? "ok" : "warn", s.resume)}</span></div>
      </header>
      <div class="doc scroll">${turnsHTML("doc")}</div>
    </div></div>`);
    ov.onclick = (e) => { if (e.target === ov || e.target.closest(".close")) { sheet = null; drawSheet(); } };
    node.append(ov);
  }

  draw();
  root.append(node);
}

/* ═══ Switcher ════════════════════════════════════════════════════════════ */

const VARIANTS = [
  { key:"A", name:"Console",   render:renderA },
  { key:"B", name:"Navigator", render:renderB },
  { key:"C", name:"Timeline",  render:renderC },
];
const SKINS = [
  { key:"slate",    label:"Slate" },
  { key:"paper",    label:"Paper" },
  { key:"terminal", label:"Terminal" },
];

const params = new URLSearchParams(location.search);
let vi = Math.max(0, VARIANTS.findIndex(v => v.key === (params.get("variant") || "A").toUpperCase()));
let skin = SKINS.some(s => s.key === params.get("skin")) ? params.get("skin") : null;

const stage = document.getElementById("stage");

function syncURL() {
  try {
    const p = new URLSearchParams();
    p.set("variant", VARIANTS[vi].key);
    if (skin) p.set("skin", skin);
    history.replaceState(null, "", "?" + p.toString());
  } catch (_) { /* sandboxed viewers may block this — state lives in JS anyway */ }
}

function applySkin() {
  if (skin) document.documentElement.setAttribute("data-skin", skin);
  else document.documentElement.removeAttribute("data-skin");
  document.querySelectorAll("#skins button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.skin === skin)));
}

function show() {
  const v = VARIANTS[vi];
  stage.innerHTML = "";
  v.render(stage);
  document.getElementById("vkey").textContent = v.key;
  document.getElementById("vname").textContent = v.name;
  syncURL();
}

document.getElementById("skins").innerHTML =
  SKINS.map(s => `<button data-skin="${s.key}" aria-pressed="false">${s.label}</button>`).join("");
document.querySelectorAll("#skins button").forEach(b => b.onclick = () => {
  skin = (skin === b.dataset.skin) ? null : b.dataset.skin;
  applySkin(); syncURL();
});

const step = (d) => { vi = (vi + d + VARIANTS.length) % VARIANTS.length; show(); };
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
});

applySkin();
show();
</script>
